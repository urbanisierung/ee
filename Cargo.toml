[package]
name = "ee"
version = "0.1.0"
edition = "2021"
description = "ee, eee, rr — tiny terminal tools for env files, repo hopping, and per-directory commands"
repository = "https://github.com/urbanisierung/ee"
homepage = "https://github.com/urbanisierung/ee"
license = "MIT"
readme = "README.md"
keywords = ["cli", "tui", "productivity", "shell", "dotfiles"]
categories = ["command-line-utilities"]
authors = ["Adam Urban"]

[lib]
name = "ee_tools"
path = "src/lib.rs"

[[bin]]
name = "ee"
path = "src/main.rs"

[[bin]]
name = "eee"
path = "src/eee.rs"

[[bin]]
name = "rr"
path = "src/rr.rs"

[dependencies]
crossterm = "0.29"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
